<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Expense</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="add-expense-page">
    <section id="expense-form-section">
      <h1 class="header">ADD NEW EXPENSE</h1>

      <form id="expense-form">
         <div class="form-field">
            <label for="amount">Amount: $</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" required />
          </div>

		<div class="form-field">
			<label for="category">Category:</label>
			<select id="category" name="category" required>
			  <option value="food">Food &amp; Dining</option>
			  <option value="transport">Transportation</option>
			  <option value="entertainment">Entertainment</option>
			  <option value="other">Other</option>
			</select>
		</div>
		
		<div class="form-field">
			<label for="description">Description:</label>
			<input type="text" id="description" name="description" maxlength="120" placeholder="e.g., Coffee at Starbucks" required />
		</div>
		
        <div class="form-field">
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" value="2024-03-20" required />
          </div>

        <div class="actions">
          <button type="button" id="save-expense" onclick="addInformation()">Save Expense</button>
          <button type="button" id="cancel-expense" onclick="cancelarFormulario()">Cancel</button>
        </div>
      </form>
    </section>

    <section id="todays-expenses">
      <h2 class="subheader">TODAY'S EXPENSES</h2>
      <ul class="expense-list">
      </ul>
      <p class="total">Total today: $0.00</p>
      <p class="inpAmount" style="display: none;">0</p>
    </section>
  </main>
  <script src="javascript/expenses.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous">
    </script>
</body>

</html>
